[package]
name                   = "encoder-demo"
description            = "Reads a V635 rotary encoder and logs detents and button events"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true

[[bin]]
name = "rotary-encoder"
path = "./src/bin/main.rs"

[dependencies]
rotary-encoder = { path = "../crates/rotary-encoder", features = ["defmt"] }

# The chip feature lives here, not in the library: only the final binary can pick it.
esp-hal = { workspace = true, features = ["defmt", "esp32s3"] }

defmt                  = { workspace = true }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s3"] }

critical-section = "1.2.0"
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target       = { version = "0.6.2", features = ["defmt"] }
