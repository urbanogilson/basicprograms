[workspace]
members = ["crates/i2s-speaker", "firmware"]
# So plain `cargo run --release` still flashes the firmware from the workspace root.
default-members = ["firmware"]
resolver        = "3"

[workspace.package]
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"

[workspace.dependencies]
# The chip feature is deliberately absent here so the library can stay chip-agnostic;
# firmware/Cargo.toml adds `esp32s3` and cargo unifies it across the graph.
# "unstable" is required: the I2S driver and the I2S0/DMA_CH0 peripheral singletons
# are all gated behind it in esp-hal 1.0.
esp-hal = { version = "~1.0", features = ["unstable"] }

defmt = "1.0.1"

# Profiles only take effect at the workspace root - cargo ignores them in members.
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
