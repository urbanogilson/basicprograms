[workspace]
members = ["crates/oled-screen", "firmware"]
# So plain `cargo run --release` still flashes the firmware from the workspace root.
default-members = ["firmware"]
resolver        = "3"

[workspace.package]
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"

[workspace.dependencies]
# I2C is a *stable* esp-hal driver, so unlike the I2S projects no "unstable" feature is needed.
# The chip feature is deliberately absent here; firmware/Cargo.toml adds `esp32s3`.
esp-hal = { version = "~1.0" }

defmt              = "1.0.1"
embedded-hal       = "1.0"
embedded-graphics  = "0.8"
ssd1306            = "0.10"
display-interface  = "0.5"

# Profiles only take effect at the workspace root - cargo ignores them in members.
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
